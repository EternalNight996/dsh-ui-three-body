# 驯兽师（dsh-beast-master）bundle 补丁层。
# 安装后由 package.json 的 dsh.bundle.patch 自动生效；后层
# （profile 自己的 cordis.patch.yml / --patch）可按 id 覆盖或禁用本行。
#
# 客户端 UI（悬浮萌宠 + 设置页）由 package.json 的 dsh.client 元数据自动挂载，
# 无需在此声明任何 client 行。

- insert:
    - id: beast-tamer
      name: dsh-beast-master
      config:
        enabled: true
        mode: balanced
        petEnabled: true
        kernelOverride: ''

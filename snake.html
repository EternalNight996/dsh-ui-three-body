<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · 像素街机</title>
<style>
  :root { --bg:#0a0e14; --grid:rgba(34,255,136,0.06); --snake:#22ff88; --head:#b6ffd9; --food:#ff3b57; --score:#f5f5f5; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--score); font-family:'Courier New',monospace; user-select:none; }
  .wrap { text-align:center; }
  h1 { font-size:20px; letter-spacing:4px; color:var(--snake); margin:0 0 12px; text-shadow:0 0 12px rgba(34,255,136,.5); }
  canvas { background:var(--bg); border:1px solid rgba(34,255,136,.25); box-shadow:0 0 0 4px rgba(34,255,136,.06), inset 0 0 46px rgba(34,255,136,.03); image-rendering:pixelated; border-radius:4px; }
  .hud { display:flex; justify-content:space-between; align-items:center; margin:12px auto 0; max-width:400px; font-size:14px; letter-spacing:1px; }
  #score { color:var(--food); font-weight:700; }
  .btn { margin-top:12px; padding:8px 22px; background:transparent; color:var(--snake); border:1px solid var(--snake); border-radius:4px; font-family:inherit; font-size:14px; letter-spacing:2px; cursor:pointer; }
  .btn:hover { background:rgba(34,255,136,.12); }
  .hint { margin-top:14px; font-size:12px; opacity:.55; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SNAKE · 像素街机</h1>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="hud"><span>得分 <b id="score">0</b></span><span id="state">方向键 / WASD 控制</span></div>
  <button class="btn" id="restart">重新开始</button>
  <div class="hint">方向键 / WASD 移动 · 吃到食物 +10 · 撞墙或撞到自己结束</div>
</div>
<script>
(function(){
  var GRID=20, CELL=400/GRID;
  var c=document.getElementById('c'), ctx=c.getContext('2d');
  var snake, dir, nextDir, food, score, over=false, start=false;
  function spawn(){ var f; do{ f={x:(Math.random()*GRID)|0, y:(Math.random()*GRID)|0}; } while(snake.some(s=>s.x===f.x&&s.y===f.y)); return f; }
  function draw(){
    ctx.clearRect(0,0,400,400);
    // 网格
    ctx.strokeStyle='rgba(34,255,136,0.05)';
    for(var i=0;i<=GRID;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,400); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(400,i*CELL); ctx.stroke(); }
    // 食物
    ctx.fillStyle='#ff3b57'; ctx.shadowColor='#ff3b57'; ctx.shadowBlur=10; ctx.fillRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4); ctx.shadowBlur=0;
    // 蛇（头亮、身渐变）
    for(var i=snake.length-1;i>=0;i--){
      var s=snake[i], t=i/snake.length;
      ctx.fillStyle = i===0 ? '#b6ffd9' : 'rgba(34,255,136,'+(1-t*0.55+0.15)+')';
      ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
    }
  }
  function setState(t){ document.getElementById('state').textContent=t; }
  function reset(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}]; dir={x:1,y:0}; nextDir=dir; score=0; over=false;
    document.getElementById('score').textContent=0; food=spawn(); draw(); setState('方向键 / WASD 控制');
  }
  function tick(){
    if(over||!start) return;
    dir=nextDir;
    var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){
      over=true; setState('GAME OVER · 点「重新开始」'); draw(); return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){ score+=10; document.getElementById('score').textContent=score; food=spawn(); } else snake.pop();
    draw();
  }
  document.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(k==='arrowup'||k==='w'){ e.preventDefault(); if(dir.y!==1) nextDir={x:0,y:-1}; }
    else if(k==='arrowdown'||k==='s'){ e.preventDefault(); if(dir.y!==-1) nextDir={x:0,y:1}; }
    else if(k==='arrowleft'||k==='a'){ e.preventDefault(); if(dir.x!==1) nextDir={x:-1,y:0}; }
    else if(k==='arrowright'||k==='d'){ e.preventDefault(); if(dir.x!==-1) nextDir={x:1,y:0}; }
    if(!start){ start=true; setState('游戏中'); }
  });
  document.getElementById('restart').addEventListener('click',function(){ start=true; reset(); setState('游戏中'); });
  reset(); draw();
  setInterval(tick, 120);
})();
</script>
</body>
</html>
